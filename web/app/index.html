<!doctype html>
<!-- Map Vietnam viewer: the page shell. app.js builds the maps and fills the panel and popovers;
     app.css lays them out. Bump the ?v= on app.css / app.js whenever either changes, so browsers refetch them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Dated historical maps of Vietnam laid over today's map, with war-era records to search, filter, pin and export.">
<title>Map Vietnam</title>
<!-- The app icon (packaging/make_icons.py) in small: old map left, today right. Inline, so the page asks the
     server for no favicon file. -->

3.0 9.5 14.0 9.6 14.5 8.9 14.4 8.6 13.6 8.1 13.9 7.8 13.1 7.2 12.4 7.7 11.5 7.4 11.0 6.7 11.2 6.0 11.0 5.7 10.7 6.0 9.8 4.7 10.4 4.1 11.3 4.6 11.8 4.1 12.1 4.4 12.3 4.0 12.9 4.5 13.2 4.0 13.6 4.2 14.1 4.0 14.4 3.4 15.1 3.0 16.1 3.8 16.6 3.7 17.6 4.0 17.3 4.5 17.4 5.4 18.0 5.6 18.6 6.1 19.3 6.0z' fill='%23704e2a'/%3E%3C/g%3E%3Crect x='16.3' width='1.4' height='32' fill='%23faf8f2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap&subset=vietnamese">
<!-- MapLibre is pinned and checked with Subresource Integrity (hashes from unpkg's ?meta listing); Google Fonts
     serves different CSS per browser, so it cannot carry a fixed hash. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.css" integrity="sha256-eSrJl9z2rm9kPrTi3uRjDIXnBWUmvY+4X/6Dxn1sQbQ=" crossorigin="anonymous">
<link rel="stylesheet" href="/app/app.css?v=45">
<script src="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.js" integrity="sha256-+Rfm6vvWA0RQ5xsKj4mT05mdHiWFDHBIF05XI3/PYwU=" crossorigin="anonymous"></script>
</head>
<body>
<!-- The maps fill the window; #mapB and the divider appear only while comparing. -->
<div id="maps">
  <div id="mapA" class="map" role="region" aria-label="Map"></div>
  <div id="mapB" class="map" hidden role="region" aria-label="Comparison map (right side)"></div>
  <div id="divider" hidden>
    <button id="dividerHandle" class="round" aria-label="Drag to compare the two maps (arrow keys move it)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></button>
    <span class="side-tag left" id="tagA"></span><span class="side-tag right" id="tagB"></span>
  </div>
</div>

<div id="filterPill" hidden><button id="filterOpen" aria-haspopup="dialog" aria-controls="popLayers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span id="filterText"></span></button><button id="filterClear" aria-label="Clear filters: show all layers and all years" title="Show everything"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<!-- Not a live region: it comes and goes on every pan, which a screen reader would announce each time. -->
<div id="loading" hidden><span class="spin" aria-hidden="true"></span><span id="loadingText">Loading…</span></div>

<!-- Sidebar (laptop) / bottom sheet (phone) -->
<aside id="panel" data-state="peek" class="booting" aria-label="Search and details">
  <div id="grab" role="button" tabindex="0" aria-label="Resize panel"><span class="handle"></span></div>
  <div id="omniRow">
    <div id="omni" role="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
        placeholder="Search places or a grid ref" aria-label="Search places, hamlets, records or a wartime grid reference"
        role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <kbd class="hint-key" aria-hidden="true">/</kbd>
      <button id="qClear" class="round small ghost" hidden aria-label="Clear search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button id="qCancel" class="linkish" hidden>Cancel</button>
  </div>
  <div id="panelScroll">
    <ul id="results" role="listbox" aria-label="Search results" hidden></ul>
    <div id="view"></div>
  </div>
</aside>

<!-- Map controls, top right -->
<div id="controls" role="group" aria-label="Map controls">
  <div class="ctl-group">
    <button id="panelBtn" class="ctl desk-only" aria-pressed="true" aria-label="Hide sidebar" title="Hide sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <button id="styleBtn" class="ctl" aria-haspopup="dialog" aria-expanded="false" aria-controls="popStyle" aria-label="Map style" title="Map style">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg></button>
    <button id="layersBtn" class="ctl" aria-haspopup="dialog" aria-expanded="false" aria-controls="popLayers" aria-label="Evidence layers" title="Evidence layers">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    <button id="settingsBtn" class="ctl" aria-pressed="false" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4" stroke-width="2.6" stroke-dasharray="2.6 3.28"/><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2.4"/></svg></button>
  </div>
  <div class="ctl-group">
    <button id="locBtn" class="ctl" aria-pressed="false" aria-label="Show my position" title="Show my position">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4L3 11l7 2.5L12.5 21 20 4z"/></svg></button>
  </div>
  <div class="ctl-group zoom-group">
    <button id="zin" class="ctl" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" class="ctl" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  </div>
  <button id="compass" class="ctl solo" aria-label="Reset map to north" title="Reset to north">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="n" d="M12 3l3.5 9h-7L12 3z"/><path d="M12 21l-3.5-9h7L12 21z"/></svg></button>
</div>

<!-- Popovers, filled by app.js when opened -->
<div id="popStyle" class="popover" role="dialog" aria-label="Map style" hidden></div>
<div id="popLayers" class="popover" role="dialog" aria-label="Evidence layers" hidden></div>
<div id="popMaps" class="popover maps-pop" role="dialog" aria-label="Choose a historical map" hidden></div>

<!-- Floating historical-map bar, bottom centre -->
<div id="mapbar" role="toolbar" aria-label="Historical map">
  <button id="pickA" class="mb-pick" aria-haspopup="dialog" aria-expanded="false" aria-controls="popMaps">
    <span class="mb-side" id="pickAside" hidden>Left</span>
    <span class="mb-text"><span class="mb-title" id="pickAtitle">Today</span><span class="mb-sub" id="pickAsub"></span></span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    <svg class="add" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <label class="mb-opacity" id="opWrap" title="Old map opacity">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 010 16z" fill="currentColor" stroke="none"/></svg>
    <span id="opSide" class="op-side" hidden></span>
    <input id="opacity" type="range" min="0" max="100" value="60" aria-label="Old map opacity">
    <span id="opVal" class="mono">60%</span></label>
  <button id="pickB" class="mb-pick" aria-haspopup="dialog" aria-expanded="false" aria-controls="popMaps" hidden>
    <span class="mb-side">Right</span>
    <span class="mb-text"><span class="mb-title" id="pickBtitle">Today</span><span class="mb-sub" id="pickBsub"></span></span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
  <button id="mbCmp" class="mb-icon" aria-pressed="false" aria-label="Compare two maps" title="Compare (swipe between two maps)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 2v20"/></svg></button>
  <div id="mbNote" class="mb-note" role="status" hidden></div>
</div>

<!-- Banner while choosing where to place a candidate site -->
<div id="placing" hidden role="status">
  <span>Click the map where the candidate site is</span>
  <button id="placingCancel" class="btn small">Cancel</button>
</div>

<!-- Shown once "Quit Map Vietnam" has stopped the local server: the page cannot do anything without it. -->
<div id="gone" role="alertdialog" aria-labelledby="goneTitle" hidden>
  <div><h1 id="goneTitle" tabindex="-1">Map Vietnam has stopped</h1>
  <p>You can close this window. To use it again, start Map Vietnam the way you did before, then reload this page.</p></div>
</div>

<div id="srLive" class="sr-only" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastUndo" class="linkish" hidden>Undo</button></div>
<script src="/app/app.js?v=54"></script>
</body>
</html>
